<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuki Store - Danh Mục Sản Phẩm</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- TOP-BAR -->
    <div class="top-bar">
      <div class="top-bar-inner">
        <div class="top-bar-left">
          <span><i class="fas fa-phone-alt"></i> Hotline: 1900 6868</span>
          <span class="divider">|</span>
          <span><i class="fas fa-shield-alt"></i> Hàng chính hãng 100%</span>
        </div>
        <div class="top-bar-right">
          <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">
            <i class="fas fa-moon"></i> <span id="themeText">Chế độ tối</span>
          </button>
          <span class="divider">|</span>
          <a href="javascript:void(0)" onclick="refreshOnlineImages()"
            ><i class="fas fa-sync-alt"></i> Làm mới ảnh</a
          >
        </div>
      </div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-left">
          <a href="index.html" class="logo"><i class="fas fa-shopping-bag"></i> YUKI STORE</a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Bạn cần tìm gì? (Áo, Giày, Balo, Phím cơ...)"
            onkeypress="handleSearchKey(event)"
          />
          <button onclick="searchProducts()"><i class="fas fa-search"></i> Tìm kiếm</button>
        </div>

        <ul class="nav-links">
          <li>
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Trang Chủ</a>
          </li>
          <li>
            <a href="products.html" class="nav-link active"
              ><i class="fas fa-th-large"></i> Sản Phẩm</a
            >
          </li>
          <!-- Nút Yêu thích (Wishlist) -->
          <li>
            <a href="javascript:void(0)" class="nav-link" onclick="openWishlistModal()">
              <i class="fas fa-heart" style="color: #ef4444"></i> Yêu thích
              <span id="wishlist-count" class="badge" style="background: #ef4444">0</span>
            </a>
          </li>
          <li id="auth-nav-item">
            <a href="login.html" class="nav-link"><i class="fas fa-user-circle"></i> Đăng nhập</a>
          </li>
          <li>
            <a href="cart.html" class="nav-link cart-btn">
              <i class="fas fa-shopping-cart"></i> Giỏ Hàng
              <span id="cart-count" class="badge">0</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- CONTAINER NỘI DUNG SẢN PHẨM -->
    <div class="container" style="margin-top: 30px">
      <div class="section-header">
        <h2 class="section-title" id="product-page-title">TẤT CẢ SẢN PHẨM</h2>
      </div>

      <!-- THANH ĐIỀU KHIỂN: LỌC DANH MỤC, KHOẢNG GIÁ & SẮP XẾP GIÁ -->
      <div class="product-toolbar">
        <div class="filter-buttons">
          <button onclick="applyCategoryFilter('all', this)" class="active">Tất cả</button>
          <button onclick="applyCategoryFilter('hot', this)">Sản Phẩm Hot</button>
          <button onclick="applyCategoryFilter('new', this)">Hàng Mới</button>
          <button onclick="applyCategoryFilter('promo', this)">Khuyến Mãi</button>
        </div>

        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap">
          <div class="sort-control">
            <label for="filterPriceRange"><i class="fas fa-filter"></i> Khoảng giá:</label>
            <select id="filterPriceRange" onchange="applyPriceRangeFilter(this.value)">
              <option value="all">Tất cả mức giá</option>
              <option value="under200">Dưới 200.000 đ</option>
              <option value="200to500">200.000 đ - 500.000 đ</option>
              <option value="above500">Trên 500.000 đ</option>
            </select>
          </div>

          <div class="sort-control">
            <label for="sortPriceSelect"><i class="fas fa-sort-amount-down"></i> Sắp xếp:</label>
            <select id="sortPriceSelect" onchange="applyPriceSort(this.value)">
              <option value="default">Mặc định</option>
              <option value="asc">Giá tăng dần</option>
              <option value="desc">Giá giảm dần</option>
            </select>
          </div>
        </div>
      </div>

      <!-- KHU VỰC HIỂN THỊ DANH SÁCH SẢN PHẨM -->
      <div id="all-products" class="product-grid"></div>
    </div>

    <!-- POPUP WISHLIST MODAL -->
    <div id="wishlist-modal" class="auth-modal">
      <div class="auth-modal-content" style="max-width: 600px; width: 90%">
        <span class="auth-close" onclick="closeWishlistModal()">&times;</span>
        <h3 style="margin-bottom: 20px; color: #2c3e50">
          <i class="fas fa-heart" style="color: #ef4444"></i> SẢN PHẨM BẠN ĐÃ YÊU THÍCH
        </h3>
        <div id="wishlist-items-box" style="max-height: 400px; overflow-y: auto"></div>
      </div>
    </div>

    <!-- CHATBOX -->
    <div class="chat-widget-btn" onclick="toggleChat()"><i class="fas fa-comments"></i></div>
    <div class="chat-box-container" id="chatBox">
      <div class="chat-header">
        <span>Yuki Store Hỗ Trợ</span><i class="fas fa-times" onclick="toggleChat()"></i>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="chat-message bot">Dạ Yuki Store xin chào! Bạn cần tư vấn sản phẩm nào ạ?</div>
      </div>
      <div class="chat-input">
        <input
          type="text"
          id="userInput"
          placeholder="Nhập tin nhắn..."
          onkeypress="handleChatKey(event)"
        />
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="main.js"></script>
  </body>
</html>
