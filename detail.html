<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuki Store - Chi Tiết Sản Phẩm</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- TOP-BAR -->
    <div class="top-bar">
      <div class="top-bar-inner">
        <div class="top-bar-left">
          <span><i class="fas fa-phone-alt"></i> Hotline: 1900 6868</span>
          <span class="divider">|</span>
          <span><i class="fas fa-shield-alt"></i> Hàng chính hãng 100%</span>
        </div>
        <div class="top-bar-right">
          <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">
            <i class="fas fa-moon"></i> <span id="themeText">Chế độ tối</span>
          </button>
        </div>
      </div>
    </div>

    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-left">
          <a href="index.html" class="logo"><i class="fas fa-shopping-bag"></i> YUKI STORE</a>
        </div>
        <ul class="nav-links">
          <li>
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Trang Chủ</a>
          </li>
          <li>
            <a href="products.html" class="nav-link"><i class="fas fa-th-large"></i> Sản Phẩm</a>
          </li>
          <li id="auth-nav-item">
            <a href="login.html" class="nav-link"><i class="fas fa-user-circle"></i> Đăng nhập</a>
          </li>
          <li>
            <a href="cart.html" class="nav-link cart-btn">
              <i class="fas fa-shopping-cart"></i> Giỏ Hàng
              <span id="cart-count" class="badge">0</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container" style="margin-top: 30px">
      <div class="section-header">
        <h2 class="section-title">THÔNG TIN CHI TIẾT SẢN PHẨM</h2>
      </div>
      <!-- Khu vực hiển thị sản phẩm chính -->
      <div id="product-detail"></div>

      <!-- KHỐI SẢN PHẨM LIÊN QUAN -->
      <div style="margin-top: 50px">
        <div class="section-header">
          <h2 class="section-title"><i class="fas fa-layer-group"></i> SẢN PHẨM LIÊN QUAN</h2>
        </div>
        <div id="related-products" class="product-grid"></div>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="main.js"></script>
  </body>
</html>
